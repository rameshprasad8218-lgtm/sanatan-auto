name: upload
on:
  schedule: [{cron: "0 */3 * * *"}]
  workflow_dispatch:
  push:
    paths: ["meta/queue.json"]
permissions: {contents: write}
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install google-api-python-client google-auth
      - run: python scripts/upload.py
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - run: |
          git config user.name "auto"; git config user.email "auto@users.noreply.github.com"
          git add meta/queue.json; git diff --cached --quiet || (git commit -m "queue update" && git push)
