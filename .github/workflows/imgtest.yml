name: imgtest
on:
  push:
    paths: ['meta/imgtest.trigger']
  workflow_dispatch:
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/genimg.py meta/imgtest.json out
      - uses: actions/upload-artifact@v4
        with: {name: imgtest, path: out}
