name: blendtest
on:
  push:
    paths: ['meta/blendtest.trigger']
permissions:
  contents: write
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq blender ffmpeg
      - run: mkdir -p /tmp/f && blender -b -P scripts/blender_test.py 2>&1 | grep -E "RENDER_SECONDS|Error|Blender [0-9]" 
      - run: |
          ffmpeg -v error -framerate 24 -i /tmp/f/%04d.png -c:v libx264 -pix_fmt yuv420p test.mp4
          mkdir -p gen/blendtest && cp test.mp4 gen/blendtest/
          git config user.name sanatan-bot; git config user.email bot@users.noreply.github.com
          git add gen && git commit -m "blender test render" && git pull --rebase -q && git push
